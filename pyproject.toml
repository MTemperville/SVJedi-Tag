[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "svjedi-tag"
version = "1.1.0"
dependencies = [
    'pysam',
    'networkx',
    'prettytable',
    'wcwidth',
    'pandas',
    'seaborn',
    'tharos-pytools',
]

[project.scripts]
svjedi-tag = "src.__main__:main"


[tool.setuptools.packages.find]
include = ["src"]

[tool.setuptools.package-data]
svjedi-tag = ["src/*"]